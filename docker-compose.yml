version: "3.8"

services:
  postgres:
    image: postgres:17
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: quotedb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  fastapi:
    build:
      context: ./backend
    container_name: fastapi-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/quotedb
    depends_on:
      - postgres

  app:
    build:
      context: .
    container_name: node-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/quotedb
      FASTAPI_URL: http://fastapi:8001

      PORT: 8000
    depends_on:
      - postgres
      - fastapi

volumes:
  postgres_data:
